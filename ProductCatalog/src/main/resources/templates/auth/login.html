<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>

    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<main class="main-auth">
    <h1>Вход</h1>

    <div class="message success" th:if="${param.registered}">
        Регистрация прошла успешно. Теперь войдите в систему.
    </div>

    <div class="message error" th:if="${param.error}">
        Неверный email или пароль.
    </div>

    <div class="message success" th:if="${param.logout}">
        Вы вышли из системы.
    </div>

    <form method="post" th:action="@{/login}" autocomplete="off">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <label for="username">Email</label>
        <input id="username"
               type="email"
               name="username"
               autocomplete="off"
               required>

        <label for="password">Пароль</label>
        <div class="password-wrapper">
            <input id="password"
                   type="password"
                   name="password"
                   autocomplete="new-password"
                   required>

            <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('password', this)">
                👁
            </button>
        </div>

        <button type="submit">Войти</button>
    </form>

    <div class="links">
        <a href="/">На главную</a>
        <a href="/register">Регистрация</a>
    </div>
</main>

<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);

        if (input.type === 'password') {
            input.type = 'text';
            button.textContent = '🙈';
        } else {
            input.type = 'password';
            button.textContent = '👁';
        }
    }
</script>

</body>
</html>
