<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            color: #222;
        }

        main {
            max-width: 420px;
            margin: 80px auto;
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 50px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 6px;
            width: auto;
            margin-top: 0;
            padding: 10px;
            border: none;
            background: transparent;
            color: #4b5563;
            cursor: pointer;
            font-size: 18px;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .links {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>

<main>
    <h1>Вход</h1>

    <div class="message success" th:if="${param.registered}">
        Регистрация прошла успешно. Теперь войдите в систему.
    </div>

    <div class="message error" th:if="${param.error}">
        Неверный email или пароль.
    </div>

    <div class="message success" th:if="${param.logout}">
        Вы вышли из системы.
    </div>

    <form method="post" th:action="@{/login}" autocomplete="off">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <label for="username">Email</label>
        <input id="username"
               type="email"
               name="username"
               autocomplete="off"
               required>

        <label for="password">Пароль</label>
        <div class="password-wrapper">
            <input id="password"
                   type="password"
                   name="password"
                   autocomplete="new-password"
                   required>

            <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('password', this)">
                👁
            </button>
        </div>

        <button type="submit">Войти</button>
    </form>

    <div class="links">
        <a href="/">На главную</a>
        <a href="/register">Регистрация</a>
    </div>
</main>

<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);

        if (input.type === 'password') {
            input.type = 'text';
            button.textContent = '🙈';
        } else {
            input.type = 'password';
            button.textContent = '👁';
        }
    }
</script>

</body>
</html>
