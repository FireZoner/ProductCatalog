<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Каталог товаров</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 24px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 24px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        .header-link {
            color: white;
        }

        .search-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            margin-bottom: 24px;
        }

        .search-form {
            display: flex;
            gap: 12px;
        }

        .search-form input {
            flex: 1;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }

        .button {
            display: inline-block;
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .button.secondary {
            background: #4b5563;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .product-content {
            padding: 20px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin: 12px 0;
        }

        .empty {
            background: white;
            padding: 32px;
            border-radius: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <strong>Каталог товаров</strong>
    <a class="header-link" href="/">На главную</a>
</header>

<main>
    <section class="search-card">
        <h1>Каталог товаров</h1>

        <form class="search-form" method="get" action="/products">
            <input
                    type="text"
                    name="query"
                    placeholder="Поиск по названию или описанию"
                    th:value="${query}"
            >
            <button class="button" type="submit">Найти</button>
            <a class="button secondary" href="/products">Сбросить</a>
        </form>
    </section>

    <section class="products-grid" th:if="${!products.isEmpty()}">
        <article class="product-card" th:each="product : ${products}">
            <img th:src="${product.imageUrl}" th:alt="${product.title}">

            <div class="product-content">
                <h2 th:text="${product.title}">Название товара</h2>

                <p th:text="${product.shortDescription}">
                    Краткое описание товара
                </p>

                <div class="price">
                    <span th:text="${product.price}">0.00</span> ₽
                </div>

                <a class="button" th:href="@{/products/{id}(id=${product.id})}">
                    Подробнее
                </a>
            </div>
        </article>
    </section>

    <section class="empty" th:if="${products.isEmpty()}">
        <h2>Товары не найдены</h2>
        <p>Попробуйте изменить поисковый запрос.</p>
    </section>
</main>

</body>
</html>
