<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>История обращений</title>

    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header>
    <strong>История обращений</strong>
    <a class="header-link" href="/">На главную</a>
</header>

<main class="main-history">
    <h1>Мои обращения</h1>

    <section th:if="${feedbackRequests.isEmpty()}" class="empty">
        <h2>Обращений пока нет</h2>
        <p>Вы ещё не отправляли сообщения администратору.</p>
        <a class="button" href="/products">Перейти в каталог</a>
    </section>

    <section th:if="${!feedbackRequests.isEmpty()}">
        <article class="card" th:each="request : ${feedbackRequests}">
            <span
                    class="status"
                    th:classappend="${request.status.name() == 'PROCESSING'} ? ' status-processing' :
                                    (${request.status.name() == 'SENT'} ? ' status-sent' : ' status-error')"
                    th:text="${request.status.name() == 'PROCESSING'} ? 'Выполняется' :
                             (${request.status.name() == 'SENT'} ? 'Успешно отправлено' : 'Ошибка')">
                Статус
            </span>

            <div class="meta">
                Создано:
                <span th:text="${#temporals.format(request.createdAt, 'dd.MM.yyyy HH:mm')}">
                    01.01.2026 12:00
                </span>
            </div>

            <div class="meta" th:if="${request.product != null}">
                Товар:
                <span th:text="${request.product.title}">Название товара</span>
            </div>

            <div class="meta">
                Контакты:
                <span th:text="${request.contactName}">Имя</span>,
                <span th:text="${request.contactPhone}">Телефон</span>,
                <span th:text="${request.contactEmail}">Email</span>
            </div>

            <div class="message" th:text="${request.messageText}">
                Текст обращения
            </div>

            <div class="meta" th:if="${request.errorMessage != null}">
                Ошибка отправки email:
                <span th:text="${request.errorMessage}">Ошибка</span>
            </div>
        </article>
    </section>
</main>

</body>
</html>
