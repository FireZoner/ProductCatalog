<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Каталог товаров и обратная связь</title>

    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header>
    <strong>Курсовая работа Java</strong>

    <div class="auth-panel">
        <div th:if="${isAuthenticated}">
            <form method="post" th:action="@{/logout}">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button class="button danger" type="submit">
                    Выйти
                </button>
            </form>
        </div>

        <div th:unless="${isAuthenticated}">
            <a class="button secondary" href="/login">Войти</a>
            <a class="button" href="/register">Регистрация</a>
        </div>
    </div>
</header>

<main class="main-home">
    <h1 th:text="${pageTitle}">Каталог товаров и обратная связь</h1>

    <p>
        Это веб-сервис для просмотра каталога товаров и отправки обращений администратору.
    </p>

    <div class="actions">
        <a class="button" href="/products">Каталог товаров</a>

        <a class="button secondary" href="/feedback">
            Обратная связь
        </a>

        <a class="button secondary" href="/feedback/history">
            Мои обращения
        </a>
    </div>
</main>

</body>
</html>
